name: Build GLaDOS APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compute version
        run: |
          CODE=$((10 + ${{ github.run_number }}))
          NAME="1.2.${{ github.run_number }}"
          echo "APP_VERSION_CODE=${CODE}" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=${NAME}" >> "$GITHUB_ENV"
          
      - name: Decode signing keystore
       run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | tr -d ' \r\n\t' | base64 -d > app/release.keystore
          ls -la app/release.keystore
          keytool -list -keystore app/release.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}"

      - name: Build signed Release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk GLaDOS-AI.apk
          cat <<EOF > version.json
          {
            "versionCode": ${APP_VERSION_CODE},
            "versionName": "${APP_VERSION_NAME}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/latest/download/GLaDOS-AI.apk"
          }
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${APP_VERSION_NAME}" GLaDOS-AI.apk version.json \
            --title "GLaDOS AI v${APP_VERSION_NAME}" \
            --notes "Автоматическая сборка приложения" \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: GLaDOS-AI-APK
          path: GLaDOS-AI.apk
